name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 15
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Build and test real zsh / vi and the standalone UI
        run: make check
      - name: Check memory safety
        run: make sanitize
      - name: Package and verify the extracted arm64 binary
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: make package
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: |
            dist/zsh-lab-*-macos-arm64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  nix:
    name: Nix package (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            system: aarch64-darwin
          - runner: ubuntu-22.04
            system: x86_64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - name: Build, test and launch the Nix package
        run: |
          nix flake check -L
          nix build '.#zsh-lab^*'
          ./result-tests/bin/test-native
          ./result-tests/bin/smoke-ui "$(nix path-info .#zsh-lab)/bin/zsh-lab"
          nix run . -- --version
          nix run . -- --list

  release:
    name: Publish private GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, nix]
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download verified release files
        run: |
          gh run download "$GITHUB_RUN_ID" --name macos-release --dir dist
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
      - name: Create draft and upload assets
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "ZSH LAB $RELEASE_TAG" --notes "macOS arm64 binary (Apple Silicon). Python・tmux・追加パッケージ不要。"
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
